name: Deploy Backend

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Build and Run Docker Container
        run: |
          docker build -t hub-backend-image .
          docker stop hub-backend-app || true
          docker rm hub-backend-app || true
          docker run -d -p 3000:3000 --name hub-backend-app --network devops-network hub-backend-image
